name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  ci-broker:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/ci-broker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/ci-broker/package-lock.json
      - run: npm ci
      - run: npm test
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q tauceti_fleet
