name: CI
on:
  pull_request:
jobs:
  probe:
    runs-on: {group: TauCetiInfra, labels: [self-hosted, linux, x64, tauceti-fleet-infra]}
    steps:
      - uses: actions/checkout@v4
      - name: Environment
        run: |
          id; git --version; command -v node || true; ls -la /opt /usr/local/share/tauceti 2>&1 || true; env | sort | grep -E 'LEAN|BASH_ENV|TOOL|AGENT' || true
      - name: Processes of this uid that refuse inspection
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          uid=os.getuid()
          for p in sorted(Path('/proc').glob('[0-9]*'), key=lambda p:int(p.name)):
              try:
                  st=p.stat()
              except OSError: continue
              cmd=(p/'cmdline').read_bytes().replace(b'\0',b' ')[:120] if os.access(p/'cmdline',os.R_OK) else b'?'
              bad=[]
              for n in ('cwd','exe'):
                  try: os.readlink(p/n)
                  except OSError as e: bad.append(f'{n}:{e.errno}')
              try: list((p/'fd').iterdir())
              except OSError as e: bad.append(f'fd:{e.errno}')
              print(p.name, 'uid', st.st_uid, 'BAD' if bad and st.st_uid==uid else '', bad, cmd)
          PY
      - name: Fleet lean runtime test, verbose
        run: |
          python3 - <<'PY'
          import os, subprocess, tempfile, sys
          from pathlib import Path
          sys.path.insert(0, '.')
          from tauceti_fleet import lean_pressure, lean_runtime
          with tempfile.TemporaryDirectory() as d:
              root=Path(d); tc=root/'elan/toolchains/snapshot'; (tc/'bin').mkdir(parents=True)
              c=tc/'bin/lean'; c.write_text('#!/bin/sh\necho compiler\n'); c.chmod(0o755)
              w=root/'watchdog'; (w/'bin').mkdir(parents=True); (w/'bin/lean-real').symlink_to(c)
              e=w/'bin/lean'; e.write_text('#!/bin/sh\nexec "$(dirname "$0")/lean-real" "$@"\n'); e.chmod(0o755)
              h=root/'tauceti-lean'; h.write_bytes(Path(lean_pressure.__file__).read_bytes()); h.chmod(0o755)
              s=root/'ci-startup'; s.write_text(lean_runtime.STARTUP)
              env={**os.environ,'BASH_ENV':str(s),'WATCHDOG_TOOLCHAIN':str(w),'TAUCETI_LEAN_WRAPPER':str(h),'SHLVL':'1'}
              r=subprocess.run(['bash','-ec','bash -ec true'],env=env,text=True,capture_output=True,timeout=5); print('install', r.returncode, r.stdout, r.stderr)
              print(sorted(str(p.relative_to(root)) for p in root.rglob('*')))
              r=subprocess.run([str(e),'--print-prefix'],env={'PATH':os.environ['PATH']},text=True,capture_output=True); print('prefix', r.returncode, repr(r.stdout), r.stderr)
          PY
