name: CI
on:
  # Branch pushes would duplicate each pull_request run on GitHub-hosted runners, which the
  # whole organisation shares; only main is checked on push.
  push:
    branches: [main]
  pull_request:
# A new push to a PR cancels that PR's older run; main runs never cancel each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
# Linux jobs run on the fleet's TauCetiInfra runners (native-disk slots on our own
# machines) when the repository variable FLEET_INFRA_CI is 'true', and on GitHub-hosted
# ubuntu-24.04 otherwise: unset or change that variable to fall back. Fork pull requests
# always run hosted.
jobs:
  ci-broker:
    runs-on: ${{ vars.FLEET_INFRA_CI == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('{"group":"TauCetiInfra","labels":["self-hosted","linux","x64","tauceti-fleet-infra"]}') || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: services/ci-broker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/ci-broker/package-lock.json
      - run: npm ci
      - run: npm test
  test:
    runs-on: ${{ vars.FLEET_INFRA_CI == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('{"group":"TauCetiInfra","labels":["self-hosted","linux","x64","tauceti-fleet-infra"]}') || 'ubuntu-24.04' }}
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q tauceti_fleet
  worker-target-contract:
    runs-on: ${{ vars.FLEET_INFRA_CI == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('{"group":"TauCetiInfra","labels":["self-hosted","linux","x64","tauceti-fleet-infra"]}') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: TauCetiProject/TauCetiWorker
          ref: 205da3359574ee5b656aed11ebed916c57e1b164
          path: worker-contract
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install the merged Worker contract
        run: python -m pip install ./worker-contract
      - name: Exercise canonical target inspection and generated definitions
        run: |
          worker_binary=$(command -v tauceti)
          test -x "$worker_binary"
          export TAUCETI_TEST_WORKER="$worker_binary"
          python -m unittest discover -s tests -p test_targets.py -v
